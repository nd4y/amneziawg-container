name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the binaries must exist and report a version.
      - name: Verify image
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull "$IMG"
          docker run --rm --entrypoint /bin/sh "$IMG" -c \
            'set -e; ls -la /usr/bin/amneziawg-go /usr/bin/awg /usr/bin/awg-quick; awg --version; amneziawg-go --version 2>&1 | head -2 || true'
          # awg must be static so the same binary also runs on glibc hosts.
          docker run --rm --entrypoint /bin/sh "$IMG" -c \
            'ldd /usr/bin/awg 2>&1 | grep -q "Not a valid dynamic program\|not a dynamic executable" \
               || { echo "FAIL: awg is dynamically linked"; ldd /usr/bin/awg; exit 1; }'
          echo "awg is statically linked"

      # RouterOS can import a plain image tar when a registry pull is awkward.
      - name: Export image tar for RouterOS import
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker save "$IMG" -o amneziawg.tar
          gzip -9 amneziawg.tar
          ls -lh amneziawg.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: amneziawg-routeros-tar
          path: amneziawg.tar.gz
          retention-days: 30
